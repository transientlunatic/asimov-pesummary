name: End-to-end test (real summarypages)

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  e2e:
    name: "PESummary end-to-end test (HTCondor)"
    runs-on: ubuntu-latest
    container:
      image: htcondor/mini:latest
      options: --privileged
    defaults:
      run:
        shell: bash -el {0}
    steps:

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: etive-io/actions/setup-htcondor@v1

      - name: Install base tools
        run: |
          yum install -y sudo git

      - name: Create submit user
        uses: etive-io/actions/create-submit-user@v1

      - name: Ensure submituser can access workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e_project"
          chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Setup asimov-pesummary Environment
        uses: ./.github/actions/setup-pesummary-env
        with:
          python-version: "3.11"

      - name: Set up git
        run: |
          su - submituser <<SUBMITUSER
          set -euo pipefail
          git config --global init.defaultBranch master
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          SUBMITUSER

      - name: Create asimov project
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: cd e2e_project && asimov init "E2E Test Project"

      - name: Configure asimov environment and condor user
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            if [ -z "$CONDA_PREFIX" ] || [ ! -x "$CONDA_PREFIX/bin/summarypages" ]; then
              echo "::error::CONDA_PREFIX ('$CONDA_PREFIX') does not contain bin/summarypages" >&2
              exit 1
            fi
            asimov configuration update pipelines/environment "$CONDA_PREFIX"
            asimov configuration update condor/user submituser

      - name: Diagnose asimov.pipelines entry-point discovery as submituser
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            python3 -c "
            from importlib.metadata import entry_points
            eps = [ep for ep in entry_points(group='asimov.pipelines') if ep.value.startswith('asimov_pesummary')]
            print('Discovered asimov_pesummary entry points:', eps)
            for ep in eps:
                try:
                    ep.load()
                    print(f'  {ep.name}: loaded OK')
                except Exception as e:
                    print(f'  {ep.name}: FAILED TO LOAD: {e!r}')
            "

      - name: Apply testing configuration and fake event
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/testing_config.yaml"
            asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/fake_event.yaml"

      - name: Seed the pesummary-post config ini fixture
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project/checkouts/FAKE_PE_TEST_EVENT
            mkdir -p analyses
            cat > analyses/pesummary-post.ini << 'EOF'
            [engine]

            run = pesummary-post
            webdir = web_directory_of_run
            summrypages_executable = pesummary
            EOF
            git add analyses/pesummary-post.ini
            git commit -m "Seed pesummary-post ini fixture"

      - name: Add and build the fake upstream PE production
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/fake_pe_production.yaml" -e FAKE_PE_TEST_EVENT
            asimov manage build submit

      - name: Wait for fake PE fixtures
        uses: etive-io/actions/wait-for-files@v1
        with:
          patterns: "posterior_samples.dat"
          directory: "working/FAKE_PE_TEST_EVENT/fake-pe"
          timeout: "60"
          interval: "5"
          show-condor-q: "false"
          working-directory: "e2e_project"

      - name: Run asimov monitor for the fake PE production
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: cd e2e_project && asimov monitor

      - name: Add and build the real PESummary production
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/pesummary_production.yaml" -e FAKE_PE_TEST_EVENT
            asimov manage build submit

      - name: Wait for real summarypages output
        uses: etive-io/actions/wait-for-files@v1
        with:
          patterns: "posterior_samples.h5"
          directory: "pages/FAKE_PE_TEST_EVENT/pesummary-post/pesummary/samples"
          timeout: "600"
          interval: "15"
          working-directory: "e2e_project"

      - name: Run asimov monitor for the PESummary production
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: cd e2e_project && asimov monitor

      - name: Upload summarypages site artifact
        uses: actions/upload-artifact@v4
        with:
          name: summarypages-site
          path: e2e_project/pages/FAKE_PE_TEST_EVENT/pesummary-post/pesummary
          retention-days: 5

      # --- PESummary SubjectAnalysis: combine + incremental refresh -------
      #
      # A second phase, exercising PESummary attached to an asimov
      # SubjectAnalysis: combining several FakeCBCPipeline productions into
      # one set of summary pages, then adding a further production later
      # and confirming the refresh uses `summarypages --add_to_existing`
      # (incremental) rather than recombining everything from scratch.

      - name: Add and build the second fake upstream PE production
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/fake_pe_production_2.yaml" -e FAKE_PE_TEST_EVENT
            asimov manage build submit

      - name: Wait for second fake PE fixtures
        uses: etive-io/actions/wait-for-files@v1
        with:
          patterns: "posterior_samples.dat"
          directory: "working/FAKE_PE_TEST_EVENT/fake-pe-2"
          timeout: "60"
          interval: "5"
          show-condor-q: "false"
          working-directory: "e2e_project"

      - name: Run asimov monitor for the second fake PE production
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: cd e2e_project && asimov monitor

      - name: Add and build the PESummary SubjectAnalysis production
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/pesummary_subject_analysis.yaml" -e FAKE_PE_TEST_EVENT
            asimov manage build submit

      - name: Wait for combined summarypages output
        uses: etive-io/actions/wait-for-files@v1
        with:
          patterns: "posterior_samples.h5"
          directory: "pages/FAKE_PE_TEST_EVENT/pesummary-subject/pesummary/samples"
          timeout: "600"
          interval: "15"
          working-directory: "e2e_project"

      - name: Run asimov monitor for the PESummary SubjectAnalysis production
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: cd e2e_project && asimov monitor

      - name: Verify the initial combine includes both source analyses
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            python3 -c "
            import h5py
            with h5py.File('pages/FAKE_PE_TEST_EVENT/pesummary-subject/pesummary/samples/posterior_samples.h5', 'r') as f:
                groups = set(f.keys())
            expected = {'fake-pe', 'fake-pe-2'}
            assert expected <= groups, f'expected {expected} in {groups}'
            "
            if grep -q -- '--add_to_existing' working/FAKE_PE_TEST_EVENT/pesummary.sh; then
              echo "::error::Initial PESummary SubjectAnalysis combine unexpectedly used --add_to_existing"
              cat working/FAKE_PE_TEST_EVENT/pesummary.sh
              exit 1
            fi

      - name: Add and build the third fake upstream PE production
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/fake_pe_production_3.yaml" -e FAKE_PE_TEST_EVENT
            asimov manage build submit

      - name: Wait for third fake PE fixtures
        uses: etive-io/actions/wait-for-files@v1
        with:
          patterns: "posterior_samples.dat"
          directory: "working/FAKE_PE_TEST_EVENT/fake-pe-3"
          timeout: "60"
          interval: "5"
          show-condor-q: "false"
          working-directory: "e2e_project"

      - name: Run asimov monitor to trigger the refreshable PESummary SubjectAnalysis
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: cd e2e_project && asimov monitor

      - name: Wait for the PESummary SubjectAnalysis refresh to include fake-pe-3
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            timeout=300
            elapsed=0
            until python3 -c "
            import h5py
            with h5py.File('pages/FAKE_PE_TEST_EVENT/pesummary-subject/pesummary/samples/posterior_samples.h5', 'r') as f:
                assert 'fake-pe-3' in f.keys()
            " 2>/dev/null; do
              if [ "$elapsed" -ge "$timeout" ]; then
                echo "::error::Timed out waiting for the PESummary SubjectAnalysis refresh to pick up fake-pe-3"
                exit 1
              fi
              sleep 10
              elapsed=$((elapsed + 10))
              asimov monitor || true
            done

      - name: Verify the refresh used --add_to_existing (incremental, not a full rebuild)
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            if ! grep -q -- '--add_to_existing' working/FAKE_PE_TEST_EVENT/pesummary.sh; then
              echo "::error::Expected the PESummary SubjectAnalysis refresh to use --add_to_existing (incremental); a full rebuild happened instead"
              cat working/FAKE_PE_TEST_EVENT/pesummary.sh
              exit 1
            fi

      - name: Upload combined summarypages site artifact
        uses: actions/upload-artifact@v4
        with:
          name: summarypages-subject-site
          path: e2e_project/pages/FAKE_PE_TEST_EVENT/pesummary-subject/pesummary
          retention-days: 5

      - name: Archive artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            e2e_project/.asimov/
            e2e_project/working/
            e2e_project/checkouts/
            e2e_project/pages/
          retention-days: 5

  publish-pages:
    name: "Publish summarypages site to GitHub Pages"
    needs: e2e
    # Skip (rather than fail) for pull requests from forks: GITHUB_TOKEN is
    # read-only there regardless of the `permissions:` block above, so the
    # push to gh-pages would otherwise fail with a permission error.
    if: >-
      needs.e2e.result == 'success' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # This repo's Pages source is workflow-based (actions/deploy-pages),
    # which atomically replaces the whole live site on every deploy - so
    # this job and docs.yml's deploy both merge into, then fully redeploy,
    # the same persistent `pages-content` tree (see
    # merge-into-pages-branch) and must never run concurrently, or one
    # could redeploy a snapshot that's missing the other's just-added
    # content. Same concurrency group as docs.yml's `pages` group.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: summarypages-site
          path: site

      - name: Compute publish destination
        id: dest
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dir=pr/${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "dir=tag/${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=branch/${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge preview into the persistent pages-content branch
        uses: ./.github/actions/merge-into-pages-branch
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          content_dir: site
          destination_dir: ${{ steps.dest.outputs.dir }}

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: merged-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
