name: Deploy Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

# Grant the GITHUB_TOKEN the minimum permissions needed to deploy pages.
# `contents: write` is needed to push the built docs into the persistent
# `pages-content` storage branch (see merge-into-pages-branch) - this repo's
# Pages source is workflow-based, so that branch is the only thing that
# remembers what the summarypages e2e previews (published by e2e.yml)
# published, across this workflow's own deployments.
permissions:
  contents: write
  pages: write
  id-token: write

# Shared with e2e.yml's publish-pages job: both merge into and then fully
# redeploy the same pages-content tree, and must never run concurrently.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and docs dependencies
        run: pip install -e ".[docs]"

      - name: Build HTML documentation
        run: python -m sphinx docs/ docs/_build/html -W

      - name: Merge docs into the persistent pages-content branch
        uses: ./.github/actions/merge-into-pages-branch
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          content_dir: docs/_build/html
          destination_dir: ""

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: merged-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
