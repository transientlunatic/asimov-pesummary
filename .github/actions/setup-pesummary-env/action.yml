name: 'Setup asimov-pesummary Environment'
description: 'Install asimov-pesummary (and its asimov + pesummary dependencies) with conda'
inputs:
  python-version:
    description: 'Python version to use'
    default: '3.11'
    required: false
runs:
  using: "composite"
  steps:
    - name: Cache conda packages and pip
      uses: actions/cache@v4
      with:
        path: |
          /usr/share/miniconda/pkgs
          ~/.cache/pip
        key: conda-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          conda-${{ runner.os }}-

    - name: Set up conda environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        auto-activate-base: false
        python-version: ${{ inputs.python-version }}
        activate-environment: asimov
        channels: conda-forge
        use-mamba: true

    - name: Cache asimov-pesummary conda env
      id: cache-env
      uses: actions/cache@v4
      with:
        path: /usr/share/miniconda/envs/asimov
        key: conda-env-asimov-pesummary-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          conda-env-asimov-pesummary-${{ runner.os }}-py${{ inputs.python-version }}-

    - name: Install asimov-pesummary from source
      shell: bash -e {0}
      run: |
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        CONDA_BASE="$("${CONDA_EXE:-conda}" info --base)"
        CONDA_PYTHON="${CONDA_BASE}/envs/asimov/bin/python"
        "$CONDA_PYTHON" -m ensurepip --upgrade
        "$CONDA_PYTHON" -m pip install --force-reinstall -e ".[test]"
        echo "Installed asimov-pesummary from: $("$CONDA_PYTHON" -c 'import asimov_pesummary; print(asimov_pesummary.__file__)')"
        echo "Installed asimov from: $("$CONDA_PYTHON" -c 'import asimov; print(asimov.__file__)')"
        echo "Installed summarypages at: $("$CONDA_PYTHON" -c 'import shutil; print(shutil.which("summarypages"))')"
